name: Test SCMS Baseline on PostgreSQL 17

on:
  push:
    branches: [main]
    paths:
      - "supabase/baseline/fresh_install.sql"
      - "supabase/migrations/20261116000100_secure_profile_role_assignment_operations.sql"
      - "supabase/migrations/20261116000200_complete_authorization_permission_catalog.sql"
      - "supabase/migrations/20261116000300_require_active_role_for_branch_access.sql"
      - "supabase/migrations/20261116000400_align_administrative_finance_permissions.sql"
      - "supabase/migrations/20261117000100_add_leader_console_permission.sql"
      - "supabase/migrations/20261117000200_enforce_exact_district_role_management_scope.sql"
      - "supabase/migrations/20261117000300_remove_legacy_unscoped_resource_survey_policies.sql"
      - "scripts/build-supabase-baseline.mjs"
      - ".github/workflows/test-supabase-baseline-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    name: Fresh install and security smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scms_baseline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scms_baseline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: scms_baseline_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare minimal Supabase platform prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          -- Minimal test-only stand-in for Supabase Auth; not used in the real project.
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL

      - name: Apply fresh-install baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/baseline/fresh_install.sql

      - name: Simulate historical unscoped policies for cleanup regression coverage
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE POLICY "Users can update own profile"
            ON public.profiles FOR UPDATE TO authenticated
            USING (true) WITH CHECK (true);
          CREATE POLICY "Read published public resources"
            ON public.church_resources FOR SELECT USING (true);
          CREATE POLICY "Read published member resources"
            ON public.church_resources FOR SELECT TO authenticated USING (true);
          CREATE POLICY "Resource managers manage resources"
            ON public.church_resources FOR ALL TO authenticated
            USING (true) WITH CHECK (true);
          CREATE POLICY "Read published event surveys"
            ON public.event_surveys FOR SELECT TO authenticated USING (true);
          CREATE POLICY "Survey managers manage surveys"
            ON public.event_surveys FOR ALL TO authenticated
            USING (true) WITH CHECK (true);
          CREATE POLICY "Read questions for published surveys"
            ON public.event_survey_questions FOR SELECT TO authenticated USING (true);
          CREATE POLICY "Survey managers manage questions"
            ON public.event_survey_questions FOR ALL TO authenticated
            USING (true) WITH CHECK (true);
          CREATE POLICY "Members submit own survey responses"
            ON public.event_survey_responses FOR INSERT TO authenticated
            WITH CHECK (true);
          CREATE POLICY "Survey managers read all responses"
            ON public.event_survey_responses FOR SELECT TO authenticated USING (true);
          CREATE POLICY "Members submit answers to own responses"
            ON public.event_survey_answers FOR INSERT TO authenticated
            WITH CHECK (true);
          CREATE POLICY "Survey managers read all answers"
            ON public.event_survey_answers FOR SELECT TO authenticated USING (true);
          SQL

      - name: Apply forward role-assignment operations
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000100_secure_profile_role_assignment_operations.sql

      - name: Apply complete authorization permission catalog
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000200_complete_authorization_permission_catalog.sql

      - name: Apply active-role branch access hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000300_require_active_role_for_branch_access.sql

      - name: Apply administrative finance permission alignment
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000400_align_administrative_finance_permissions.sql

      - name: Apply exact district role-management scope and future assignment checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117000200_enforce_exact_district_role_management_scope.sql

      - name: Apply legacy resource and survey policy cleanup
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117000300_remove_legacy_unscoped_resource_survey_policies.sql

      - name: Verify legacy unscoped policies were removed
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $scms_policy_cleanup$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_policies
              WHERE schemaname = 'public'
                AND policyname = ANY (ARRAY[
                  'Users can update own profile',
                  'Read published public resources',
                  'Read published member resources',
                  'Resource managers manage resources',
                  'Read published event surveys',
                  'Survey managers manage surveys',
                  'Read questions for published surveys',
                  'Survey managers manage questions',
                  'Members submit own survey responses',
                  'Survey managers read all responses',
                  'Members submit answers to own responses',
                  'Survey managers read all answers'
                ])
            ) THEN
              RAISE EXCEPTION 'Legacy unscoped resource/survey/profile policies remain enabled.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'profiles'
                AND policyname = 'profiles_self_update'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'church_resources'
                AND policyname = 'resources_authenticated_read'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND tablename = 'event_surveys'
                AND policyname = 'event_surveys_eligible_read'
            ) THEN
              RAISE EXCEPTION 'The hardened baseline read/self-update policies were not preserved.';
            END IF;
          END
          $scms_policy_cleanup$;
          SQL

      - name: Verify exact church, district and branch role-management scope
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.districts (id, name, country) VALUES
            ('90000000-0000-4000-8000-000000000001', 'Scope District A', 'Sierra Leone'),
            ('90000000-0000-4000-8000-000000000002', 'Scope District B', 'Sierra Leone');

          INSERT INTO public.church_branches (id, district_id, name, code, country) VALUES
            ('91000000-0000-4000-8000-000000000001', '90000000-0000-4000-8000-000000000001', 'Scope Branch A1', 'SCOPE-A1', 'Sierra Leone'),
            ('91000000-0000-4000-8000-000000000002', '90000000-0000-4000-8000-000000000001', 'Scope Branch A2', 'SCOPE-A2', 'Sierra Leone'),
            ('91000000-0000-4000-8000-000000000003', '90000000-0000-4000-8000-000000000002', 'Scope Branch B1', 'SCOPE-B1', 'Sierra Leone');

          INSERT INTO auth.users (id) VALUES
            ('92000000-0000-4000-8000-000000000001'),
            ('92000000-0000-4000-8000-000000000002'),
            ('92000000-0000-4000-8000-000000000003');

          INSERT INTO public.profiles (id, auth_user_id, branch_id, first_name, last_name) VALUES
            ('93000000-0000-4000-8000-000000000001', '92000000-0000-4000-8000-000000000001', '91000000-0000-4000-8000-000000000001', 'Scope', 'Actor'),
            ('93000000-0000-4000-8000-000000000002', '92000000-0000-4000-8000-000000000002', '91000000-0000-4000-8000-000000000002', 'Scope', 'Target A'),
            ('93000000-0000-4000-8000-000000000003', '92000000-0000-4000-8000-000000000003', '91000000-0000-4000-8000-000000000003', 'Scope', 'Target B');

          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '93000000-0000-4000-8000-000000000001', r.id, 'branch',
            '91000000-0000-4000-8000-000000000001', NULL, now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'admin';
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/branch-cannot-create-district-assignment.log 2>&1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'district', NULL, '90000000-0000-4000-8000-000000000001'
          );
          COMMIT;
          SQL
          then
            echo "Branch-scoped manager unexpectedly created a district-scoped assignment."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '93000000-0000-4000-8000-000000000002', r.id, 'district',
            NULL, '90000000-0000-4000-8000-000000000001', now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'pastor';
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/branch-cannot-deactivate-district-assignment.log 2>&1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.deactivate_profile_role_assignment((
            SELECT id FROM public.profile_role_assignments
            WHERE profile_id = '93000000-0000-4000-8000-000000000002'
              AND scope_type = 'district'
              AND district_id = '90000000-0000-4000-8000-000000000001'
              AND is_active
            LIMIT 1
          ));
          COMMIT;
          SQL
          then
            echo "Branch-scoped manager unexpectedly deactivated a district assignment."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $scms_branch_denial$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.profile_role_assignments
              WHERE profile_id = '93000000-0000-4000-8000-000000000002'
                AND scope_type = 'district'
                AND district_id = '90000000-0000-4000-8000-000000000001'
                AND is_active
            ) THEN
              RAISE EXCEPTION 'Denied branch-level deactivation changed the district assignment.';
            END IF;
          END
          $scms_branch_denial$;

          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '93000000-0000-4000-8000-000000000001', r.id, 'district',
            NULL, '90000000-0000-4000-8000-000000000001', now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'admin';
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'district', NULL, '90000000-0000-4000-8000-000000000001'
          );
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'leader'),
            'branch', '91000000-0000-4000-8000-000000000002', NULL
          );
          DO $scms_district_scope$
          BEGIN
            IF NOT private.has_permission('manage_roles', '91000000-0000-4000-8000-000000000002') THEN
              RAISE EXCEPTION 'District manager could not manage a branch in their district.';
            END IF;
            IF private.has_permission('manage_roles', '91000000-0000-4000-8000-000000000003') THEN
              RAISE EXCEPTION 'District manager received permission in another district.';
            END IF;
            IF NOT private.can_access_branch('91000000-0000-4000-8000-000000000002') THEN
              RAISE EXCEPTION 'District assignment did not grant access to its other branch.';
            END IF;
            IF private.can_access_branch('91000000-0000-4000-8000-000000000003') THEN
              RAISE EXCEPTION 'District assignment leaked branch access to another district.';
            END IF;
          END
          $scms_district_scope$;
          SELECT public.deactivate_profile_role_assignment((
            SELECT id FROM public.profile_role_assignments
            WHERE profile_id = '93000000-0000-4000-8000-000000000002'
              AND scope_type = 'district'
              AND district_id = '90000000-0000-4000-8000-000000000001'
              AND is_active
            LIMIT 1
          ));
          COMMIT;
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/district-cannot-manage-other-district.log 2>&1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000003',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'district', NULL, '90000000-0000-4000-8000-000000000002'
          );
          COMMIT;
          SQL
          then
            echo "District-scoped manager unexpectedly assigned a role outside their district."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '93000000-0000-4000-8000-000000000001', r.id, 'church',
            NULL, NULL, now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'admin';
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000003',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'district', NULL, '90000000-0000-4000-8000-000000000002'
          );
          COMMIT;
          UPDATE public.profile_role_assignments SET is_active = false
          WHERE profile_id = '93000000-0000-4000-8000-000000000001';
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '93000000-0000-4000-8000-000000000001', r.id, 'district',
            NULL, '90000000-0000-4000-8000-000000000001', now() - interval '1 day', NULL, false
          FROM public.roles r WHERE r.name = 'admin';
          SQL

          for test_case in inactive expired future inactive_role; do
            if psql -v ON_ERROR_STOP=1 <<SQL >/tmp/${test_case}-district-assignment.log 2>&1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '92000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '93000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'district', NULL, '90000000-0000-4000-8000-000000000001'
          );
          COMMIT;
          SQL
            then
              echo "The ${test_case} role assignment unexpectedly granted district role management."
              exit 1
            fi

            case "$test_case" in
              inactive)
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.profile_role_assignments SET is_active = true WHERE profile_id = '93000000-0000-4000-8000-000000000001';"
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.profile_role_assignments SET expires_at = now() - interval '1 minute' WHERE profile_id = '93000000-0000-4000-8000-000000000001';"
                ;;
              expired)
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.profile_role_assignments SET expires_at = NULL, assigned_at = now() + interval '1 day' WHERE profile_id = '93000000-0000-4000-8000-000000000001';"
                ;;
              future)
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.profile_role_assignments SET assigned_at = now() - interval '1 day' WHERE profile_id = '93000000-0000-4000-8000-000000000001';"
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.roles SET is_active = false WHERE name = 'admin';"
                ;;
              inactive_role)
                psql -v ON_ERROR_STOP=1 -c "UPDATE public.roles SET is_active = true WHERE name = 'admin'; UPDATE public.profile_role_assignments SET is_active = false WHERE profile_id = '93000000-0000-4000-8000-000000000001';"
                ;;
            esac
          done

          psql -v ON_ERROR_STOP=1 -c "UPDATE public.roles SET is_active = true WHERE name = 'admin'; UPDATE public.profile_role_assignments SET is_active = false WHERE profile_id = '93000000-0000-4000-8000-000000000001';"

          echo "Church, district, branch, inactive, expired, future-dated and inactive-role checks passed."

      - name: Apply explicit leader-console permission
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117000100_add_leader_console_permission.sql

      - name: Verify leader-console permission is limited to leader and worker roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $leader_console$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM public.roles r
              JOIN public.role_permissions rp ON rp.role_id = r.id
              JOIN public.permissions p ON p.id = rp.permission_id
              WHERE r.name = 'leader' AND p.key = 'view_leader_console'
            ) THEN
              RAISE EXCEPTION 'Leader role is missing view_leader_console.';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM public.roles r
              JOIN public.role_permissions rp ON rp.role_id = r.id
              JOIN public.permissions p ON p.id = rp.permission_id
              WHERE r.name = 'worker' AND p.key = 'view_leader_console'
            ) THEN
              RAISE EXCEPTION 'Worker role is missing view_leader_console.';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM public.roles r
              JOIN public.role_permissions rp ON rp.role_id = r.id
              JOIN public.permissions p ON p.id = rp.permission_id
              WHERE r.name = 'member' AND p.key = 'view_leader_console'
            ) THEN
              RAISE EXCEPTION 'Member role must not receive view_leader_console by default.';
            END IF;
          END
          $leader_console$;
          SQL

      - name: Assert schema, RLS, policies and routines
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_public_tables integer;
            v_private_tables integer;
            v_rls_tables integer;
            v_public_policies integer;
            v_private_policies integer;
            v_private_routines integer;
          BEGIN
            SELECT count(*) INTO v_public_tables
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE';

            SELECT count(*) INTO v_private_tables
            FROM information_schema.tables
            WHERE table_schema = 'private' AND table_type = 'BASE TABLE';

            SELECT count(*) INTO v_rls_tables
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname IN ('public', 'private')
              AND c.relkind = 'r'
              AND c.relrowsecurity;

            SELECT count(*) INTO v_public_policies
            FROM pg_policies WHERE schemaname = 'public';

            SELECT count(*) INTO v_private_policies
            FROM pg_policies WHERE schemaname = 'private';

            SELECT count(*) INTO v_private_routines
            FROM information_schema.routines WHERE routine_schema = 'private';

            IF v_public_tables <> 50 THEN
              RAISE EXCEPTION 'Expected 50 public tables, found %', v_public_tables;
            END IF;
            IF v_private_tables <> 2 THEN
              RAISE EXCEPTION 'Expected 2 private tables, found %', v_private_tables;
            END IF;
            IF v_rls_tables <> 52 THEN
              RAISE EXCEPTION 'Expected RLS enabled on 52 tables, found %', v_rls_tables;
            END IF;
            IF v_public_policies <> 56 THEN
              RAISE EXCEPTION 'Expected 56 public policies, found %', v_public_policies;
            END IF;
            IF v_private_policies <> 2 THEN
              RAISE EXCEPTION 'Expected 2 private policies, found %', v_private_policies;
            END IF;
            IF v_private_routines <> 19 THEN
              RAISE EXCEPTION 'Expected 19 private routines, found %', v_private_routines;
            END IF;
            IF to_regclass('public.members') IS NOT NULL THEN
              RAISE EXCEPTION 'Legacy public.members table must not exist';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_extension e
              JOIN pg_namespace n ON n.oid = e.extnamespace
              WHERE e.extname = 'pgcrypto' AND n.nspname = 'extensions'
            ) THEN
              RAISE EXCEPTION 'pgcrypto must be installed in extensions schema';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_extension e
              JOIN pg_namespace n ON n.oid = e.extnamespace
              WHERE e.extname = 'btree_gist' AND n.nspname = 'extensions'
            ) THEN
              RAISE EXCEPTION 'btree_gist must be installed in extensions schema';
            END IF;
          END
          $$;
          SQL

      - name: Verify profile row-level isolation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.church_branches (id, name, code, country, is_main_branch)
          VALUES
            ('10000000-0000-4000-8000-000000000001', 'Test Branch A', 'TEST-A', 'Sierra Leone', true),
            ('10000000-0000-4000-8000-000000000002', 'Test Branch B', 'TEST-B', 'Sierra Leone', false);

          INSERT INTO auth.users (id) VALUES
            ('30000000-0000-4000-8000-000000000001'),
            ('30000000-0000-4000-8000-000000000002');

          INSERT INTO public.profiles (
            id, auth_user_id, branch_id, first_name, last_name
          ) VALUES
            ('20000000-0000-4000-8000-000000000001',
             '30000000-0000-4000-8000-000000000001',
             '10000000-0000-4000-8000-000000000001', 'Test', 'Member A'),
            ('20000000-0000-4000-8000-000000000002',
             '30000000-0000-4000-8000-000000000002',
             '10000000-0000-4000-8000-000000000002', 'Test', 'Member B');
          SQL

          visible_rows="$(psql -v ON_ERROR_STOP=1 -Atq -c "
            BEGIN;
            SET LOCAL ROLE authenticated;
            SELECT set_config('request.jwt.claim.sub',
              '30000000-0000-4000-8000-000000000001', true);
            SELECT count(*) FROM public.profiles;
            COMMIT;
          " | sed -n '2p')"

          if [ "$visible_rows" != "1" ]; then
            echo "Expected authenticated member to see only their own profile; saw $visible_rows"
            exit 1
          fi

      - name: Verify anonymous and unauthorized writes are denied
        run: |
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT * FROM public.profiles LIMIT 1;" >/tmp/anon-read.log 2>&1; then
            echo "Anonymous role unexpectedly read profiles."
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL ROLE authenticated;
            SELECT set_config('request.jwt.claim.sub',
              '30000000-0000-4000-8000-000000000001', true);
            UPDATE public.profiles
            SET membership_status = 'inactive'
            WHERE auth_user_id = '30000000-0000-4000-8000-000000000001';
            COMMIT;
          " >/tmp/unauthorized-write.log 2>&1; then
            echo "Authenticated role unexpectedly changed a protected membership field."
            exit 1
          fi

          echo "Anonymous profile reads and protected membership writes were denied as expected."

      - name: Verify protected domain tables deny direct authenticated mutations
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $scms_mutation_grants$
          DECLARE
            v_table text;
            v_tables text[] := ARRAY[
              'public.currencies',
              'public.church_settings',
              'public.districts',
              'public.church_branches',
              'public.member_transfers',
              'public.roles',
              'public.role_permissions',
              'public.profile_role_assignments',
              'public.ministries',
              'public.ministry_members',
              'public.cells',
              'public.cell_members',
              'public.events',
              'public.attendance_sessions',
              'public.attendance_records',
              'public.church_resources',
              'public.event_surveys',
              'public.event_survey_questions',
              'public.event_survey_responses',
              'public.event_survey_answers',
              'public.chart_of_accounts',
              'public.funds',
              'public.financial_years',
              'public.financial_periods',
              'public.financial_accounts',
              'public.financial_documents',
              'public.giving_records',
              'public.payment_gateway_transactions',
              'public.approval_policies',
              'public.approval_policy_bands',
              'public.approval_policy_steps',
              'public.approval_requests',
              'public.approval_request_steps',
              'public.approval_decisions',
              'public.budgets',
              'public.budget_lines',
              'public.journal_entries',
              'public.journal_lines',
              'public.welfare_cases',
              'public.welfare_assistance',
              'public.welfare_campaigns',
              'public.welfare_contributions',
              'public.streams',
              'public.notifications',
              'public.audit_logs',
              'private.stream_credentials',
              'private.payment_gateway_payloads'
            ];
          BEGIN
            FOREACH v_table IN ARRAY v_tables LOOP
              IF has_table_privilege('authenticated', v_table, 'INSERT')
                 OR has_table_privilege('authenticated', v_table, 'UPDATE')
                 OR has_table_privilege('authenticated', v_table, 'DELETE') THEN
                RAISE EXCEPTION 'Authenticated role has unexpected direct DML privilege on %', v_table;
              END IF;
            END LOOP;

            IF NOT has_column_privilege('authenticated', 'public.profiles', 'first_name', 'UPDATE') THEN
              RAISE EXCEPTION 'Expected self-profile first_name column update grant is missing';
            END IF;
            IF has_column_privilege('authenticated', 'public.profiles', 'membership_status', 'UPDATE') THEN
              RAISE EXCEPTION 'Authenticated role must not directly update membership_status';
            END IF;
            IF has_column_privilege('authenticated', 'public.profiles', 'portal_access_status', 'UPDATE') THEN
              RAISE EXCEPTION 'Authenticated role must not directly update portal_access_status';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.event_registrations', 'INSERT') THEN
              RAISE EXCEPTION 'Expected self-registration INSERT grant is missing';
            END IF;
            IF has_table_privilege('authenticated', 'public.event_registrations', 'UPDATE')
               OR has_table_privilege('authenticated', 'public.event_registrations', 'DELETE') THEN
              RAISE EXCEPTION 'Event registrations must not expose direct UPDATE or DELETE';
            END IF;
            IF NOT has_table_privilege('authenticated', 'public.stream_chat_messages', 'INSERT') THEN
              RAISE EXCEPTION 'Expected stream chat INSERT grant is missing';
            END IF;
            IF NOT has_column_privilege('authenticated', 'public.notification_recipients', 'read_at', 'UPDATE') THEN
              RAISE EXCEPTION 'Expected notification read_at column update grant is missing';
            END IF;
            IF has_table_privilege('authenticated', 'public.notification_recipients', 'DELETE') THEN
              RAISE EXCEPTION 'Notification recipients must not expose direct DELETE';
            END IF;

            IF to_regclass('public.financial_records') IS NOT NULL
               OR to_regclass('public.prayer_requests') IS NOT NULL
               OR to_regclass('public.ministry_join_requests') IS NOT NULL THEN
              RAISE EXCEPTION 'Legacy mock-only tables must not silently enter the production baseline without an explicit schema/security design';
            END IF;
          END
          $scms_mutation_grants$;
          SQL

          echo "Protected domain tables deny direct authenticated DML; approved narrow grants remain intact."

      - name: Verify role assignment writes require manage_roles
        run: |
          if psql -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SET LOCAL ROLE authenticated;
            SELECT set_config('request.jwt.claim.sub',
              '30000000-0000-4000-8000-000000000001', true);
            SELECT public.assign_profile_role(
              '20000000-0000-4000-8000-000000000001',
              (SELECT id FROM public.roles WHERE name = 'pastor'),
              'church',
              NULL,
              NULL
            );
            COMMIT;
          " >/tmp/unauthorized-role-assignment.log 2>&1; then
            echo "A member without manage_roles unexpectedly assigned a system role."
            exit 1
          fi

          echo "Role assignment RPC correctly rejected a caller without manage_roles."


      - name: Verify scoped role assignment RPC authorization
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '20000000-0000-4000-8000-000000000001',
                 r.id, 'branch',
                 '10000000-0000-4000-8000-000000000001',
                 NULL, now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'admin';
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',
            '30000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '20000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'branch',
            '10000000-0000-4000-8000-000000000001',
            NULL
          );
          COMMIT;
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/out-of-scope-role-assignment.log 2>&1
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',
            '30000000-0000-4000-8000-000000000001', true);
          SELECT public.assign_profile_role(
            '20000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.roles WHERE name = 'pastor'),
            'branch',
            '10000000-0000-4000-8000-000000000002',
            NULL
          );
          COMMIT;
          SQL
          then
            echo "Branch-scoped role manager unexpectedly assigned a role outside their branch."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.profile_role_assignments
          SET is_active = false
          WHERE profile_id = '20000000-0000-4000-8000-000000000001'
            AND role_id = (SELECT id FROM public.roles WHERE name = 'admin')
            AND branch_id = '10000000-0000-4000-8000-000000000001';
          SQL

          echo "Branch-scoped role assignment was allowed only within the actor's assigned scope."

      - name: Verify scoped, inactive, and expired permission assignments
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '20000000-0000-4000-8000-000000000001',
                 r.id, 'branch',
                 '10000000-0000-4000-8000-000000000001',
                 NULL, now() - interval '1 day', NULL, true
          FROM public.roles r WHERE r.name = 'district_admin';

          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '20000000-0000-4000-8000-000000000001',
                 r.id, 'branch',
                 '10000000-0000-4000-8000-000000000002',
                 NULL, now() - interval '1 day', NULL, false
          FROM public.roles r WHERE r.name = 'district_admin';

          INSERT INTO public.profile_role_assignments (
            profile_id, role_id, scope_type, branch_id, district_id,
            assigned_at, expires_at, is_active
          )
          SELECT '20000000-0000-4000-8000-000000000001',
                 r.id, 'branch',
                 '10000000-0000-4000-8000-000000000002',
                 NULL, now() - interval '2 days', now() - interval '1 minute', true
          FROM public.roles r WHERE r.name = 'district_admin';
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',
            '30000000-0000-4000-8000-000000000001', true);
          DO $scms$
          BEGIN
            IF NOT private.has_permission('manage_members',
              '10000000-0000-4000-8000-000000000001') THEN
              RAISE EXCEPTION 'Active branch assignment did not grant its permission.';
            END IF;
            IF private.has_permission('manage_members',
              '10000000-0000-4000-8000-000000000002') THEN
              RAISE EXCEPTION 'Branch assignment leaked permission to another branch.';
            END IF;
            IF NOT private.can_access_branch('10000000-0000-4000-8000-000000000001') THEN
              RAISE EXCEPTION 'Active scoped role did not grant access to its branch.';
            END IF;
          END
          $scms$;
          ROLLBACK;
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.roles SET is_active = false WHERE name = 'district_admin';
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',
            '30000000-0000-4000-8000-000000000001', true);
          DO $scms$
          BEGIN
            IF private.can_access_branch('10000000-0000-4000-8000-000000000001') THEN
              RAISE EXCEPTION 'Inactive system role unexpectedly retained branch access.';
            END IF;
          END
          $scms$;
          ROLLBACK;
          UPDATE public.roles SET is_active = true WHERE name = 'district_admin';
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.profile_role_assignments
          SET is_active = false
          WHERE profile_id = '20000000-0000-4000-8000-000000000001'
            AND branch_id = '10000000-0000-4000-8000-000000000001';

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',
            '30000000-0000-4000-8000-000000000001', true);
          DO $$
          BEGIN
            IF private.has_permission('manage_members',
              '10000000-0000-4000-8000-000000000001') THEN
              RAISE EXCEPTION 'Inactive assignment unexpectedly granted a permission.';
            END IF;
            IF private.has_permission('manage_members',
              '10000000-0000-4000-8000-000000000002') THEN
              RAISE EXCEPTION 'Expired or inactive assignment unexpectedly granted a permission.';
            END IF;
          END
          $$;
          ROLLBACK;
          SQL

          echo "Branch scope, inactive assignments, and expired assignments were enforced."
