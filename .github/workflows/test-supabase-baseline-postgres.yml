            END IF;
          END
          $leader_console$;
          SQL

      - name: Assert schema, RLS, policies and routines
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_public_tables integer;
            v_private_tables integer;
            v_rls_tables integer;
            v_public_policies integer;
            v_private_policies integer;
            v_private_routines integer;
          BEGIN
            SELECT count(*) INTO v_public_tables
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE';

            SELECT count(*) INTO v_private_tables
            FROM information_schema.tables
            WHERE table_schema = 'private' AND table_type = 'BASE TABLE';

            SELECT count(*) INTO v_rls_tables
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname IN ('public', 'private')
              AND c.relkind = 'r'
              AND c.relrowsecurity;

            SELECT count(*) INTO v_public_policies
            FROM pg_policies WHERE schemaname = 'public';

            SELECT count(*) INTO v_private_policies
            FROM pg_policies WHERE schemaname = 'private';

            SELECT count(*) INTO v_private_routines
            FROM information_schema.routines WHERE routine_schema = 'private';

            IF v_public_tables <> 50 THEN
              RAISE EXCEPTION 'Expected 50 public tables, found %', v_public_tables;
            END IF;
            IF v_private_tables <> 2 THEN
              RAISE EXCEPTION 'Expected 2 private tables, found %', v_private_tables;
            END IF;
            IF v_rls_tables <> 52 THEN
              RAISE EXCEPTION 'Expected RLS enabled on 52 tables, found %', v_rls_tables;
            END IF;
            IF v_public_policies <> 56 THEN
              RAISE EXCEPTION 'Expected 56 public policies, found %', v_public_policies;
            END IF;
            IF v_private_policies <> 2 THEN
              RAISE EXCEPTION 'Expected 2 private policies, found %', v_private_policies;
            END IF;
            IF v_private_routines <> 20 THEN
              RAISE EXCEPTION 'Expected 20 private routines, found %', v_private_routines;
            END IF;
            IF to_regclass('public.members') IS NOT NULL THEN
              RAISE EXCEPTION 'Legacy public.members table must not exist';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_extension e
              JOIN pg_namespace n ON n.oid = e.extnamespace
              WHERE e.extname = 'pgcrypto' AND n.nspname = 'extensions'
            ) THEN
              RAISE EXCEPTION 'pgcrypto must be installed in extensions schema';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_extension e
              JOIN pg_namespace n ON n.oid = e.extnamespace
              WHERE e.extname = 'btree_gist' AND n.nspname = 'extensions'
            ) THEN
              RAISE EXCEPTION 'btree_gist must be installed in extensions schema';
            END IF;
          END
          $$;
          SQL

