      - name: Verify finance RPC and direct-table security boundary
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $scms_finance_rpc_security$
          BEGIN
            IF NOT has_function_privilege(
              'authenticated',
              'public.create_financial_document_transaction_idempotent(text,date,uuid,uuid,text,numeric,character,text,uuid,uuid,uuid,text,text,numeric,uuid)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Authenticated role is missing the keyed finance transaction RPC grant.';
            END IF;

            IF has_function_privilege(
              'anon',
              'public.create_financial_document_transaction_idempotent(text,date,uuid,uuid,text,numeric,character,text,uuid,uuid,uuid,text,text,numeric,uuid)',
              'EXECUTE'
            ) OR has_function_privilege(
              'service_role',
              'public.create_financial_document_transaction_idempotent(text,date,uuid,uuid,text,numeric,character,text,uuid,uuid,uuid,text,text,numeric,uuid)',
              'EXECUTE'
            ) OR has_function_privilege(
              'authenticated',
              'public.create_financial_document_transaction(text,date,uuid,uuid,text,numeric,character,text,uuid,uuid,uuid,text,text,numeric)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Only the keyed finance transaction RPC may be executable by authenticated clients.';
            END IF;

            IF NOT has_function_privilege(
              'authenticated',
              'public.decide_financial_document_approval(uuid,text,text)',
              'EXECUTE'
            ) OR has_function_privilege(
              'anon',
              'public.decide_financial_document_approval(uuid,text,text)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Finance approval RPC grants are incorrect.';
            END IF;

            IF has_function_privilege(
              'authenticated',
              'private.attach_approved_pending_financial_document_journal(uuid,uuid)',
              'EXECUTE'
            ) OR has_function_privilege(
              'anon',
              'private.attach_approved_pending_financial_document_journal(uuid,uuid)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Internal pending-journal attachment helper must not be directly executable by client roles.';
            END IF;

            IF has_table_privilege('authenticated','public.financial_documents','INSERT')
              OR has_table_privilege('authenticated','public.financial_documents','UPDATE')
              OR has_table_privilege('authenticated','public.financial_documents','DELETE')
              OR has_table_privilege('authenticated','public.journal_entries','INSERT')
              OR has_table_privilege('authenticated','public.journal_entries','UPDATE')
              OR has_table_privilege('authenticated','public.journal_entries','DELETE')
              OR has_table_privilege('authenticated','public.journal_lines','INSERT')
              OR has_table_privilege('authenticated','public.journal_lines','UPDATE')
              OR has_table_privilege('authenticated','public.journal_lines','DELETE') THEN
              RAISE EXCEPTION 'Finance transaction creation must not grant direct authenticated table DML.';
            END IF;

            IF has_function_privilege(
              'authenticated',
              'private.prevent_pending_financial_document_journal_posting()',
              'EXECUTE'
            ) OR has_function_privilege(
              'anon',
              'private.prevent_pending_financial_document_journal_posting()',
              'EXECUTE'
            ) OR has_function_privilege(
              'service_role',
              'private.prevent_pending_financial_document_journal_posting()',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Pending-journal trigger function must remain private.';
            END IF;
          END
          $scms_finance_rpc_security$;
          SQL

      - name: Verify finance document listing RPC grants and hardening
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $finance_document_listing_grants$
          BEGIN
            IF NOT has_function_privilege(
              'authenticated', 'public.get_finance_documents(uuid)', 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Authenticated role is missing the finance document listing RPC grant.';
