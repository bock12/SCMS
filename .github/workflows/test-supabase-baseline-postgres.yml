      - "supabase/migrations/20261122000200_add_scoped_finance_configuration_read_api.sql"
      - "supabase/migrations/20261122000300_add_scoped_finance_resource_write_api.sql"
      - "supabase/migrations/20261123131354_scope_aware_finance_transactions_and_journals.sql"
      - "supabase/migrations/20261124100331_require_distinct_finance_approval_levels.sql"
      - "supabase/migrations/20261124014219_add_secure_member_directory_write_api.sql"
      - "supabase/migrations/20261124021521_complete_secure_member_portal_lifecycle.sql"
      - "supabase/migrations/20261124021623_scope_member_directory_and_role_reads.sql"
      - "supabase/migrations/20261124021829_harden_member_portal_revocation_retry.sql"
      - "supabase/migrations/20261124021958_block_suspended_portal_direct_scope_policies.sql"
      - "supabase/migrations/20261124022203_block_suspended_self_profile_reads.sql"
      - "supabase/migrations/20261124022800_sync_trusted_auth_link_portal_state.sql"
      - "supabase/migrations/20261124030633_secure_ministry_roster_mutations.sql"
      - "supabase/migrations/20261124120000_harden_ministry_roster_integration.sql"
      - "supabase/migrations/20261124030904_secure_member_transfer_lifecycle.sql"
      - "supabase/migrations/20261124031237_secure_event_registration_and_attendance_api.sql"
      - "supabase/migrations/20261124031522_scope_event_attendance_sessions_by_branch.sql"
      - "supabase/migrations/20261124031837_secure_welfare_case_campaign_finance_apis.sql"
      - "supabase/migrations/20261124032240_scope_transfer_manager_reads.sql"
      - "supabase/migrations/20261124032413_least_privilege_transfer_directory_rpc.sql"
      - "supabase/migrations/20261124032502_require_both_scopes_for_managed_transfer_requests.sql"
      - "supabase/migrations/20261124130000_align_branch_district_membership_architecture.sql"
      - "supabase/migrations/20261124143000_harden_role_assignment_reactivation.sql"
      - "supabase/migrations/20261124150000_preserve_cell_membership_transfer_history.sql"
      - "supabase/migrations/20261124160000_add_scoped_leadership_appointments.sql"
      - "supabase/migrations/20261124170000_reconcile_leadership_appointments_on_transfer.sql"
      - "supabase/tests/member-directory-write-api.sql"
      - "supabase/tests/member-portal-lifecycle.sql"
      - "supabase/tests/ministry_roster_lifecycle.sql"
