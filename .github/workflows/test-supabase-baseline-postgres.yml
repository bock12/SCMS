      - "supabase/tests/branch_district_membership_alignment.sql"
      - "supabase/tests/event_registration_attendance_lifecycle.sql"
      - "supabase/tests/welfare_case_campaign_lifecycle.sql"
      - "supabase/tests/department_requisition_payment_integration.sql"
      - "supabase/tests/department_requisition_approval_lifecycle.sql"
